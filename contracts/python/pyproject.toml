[project]
name = "disco-contracts"
version = "0.1.0"
description = "Disco data contracts: Pydantic models and generated JSON Schema"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disco_contracts"]
