[project]
name = "disco-workspace"
version = "0.1.0"
description = "Disco development workspace"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema==4.24.0",
  "mypy==1.16.1",
  "pytest==8.4.1",
  "ruff==0.12.0",
  "types-jsonschema==4.24.0.20250528",
]

[tool.uv.workspace]
members = ["services/*", "contracts/python"]

[tool.pytest.ini_options]
testpaths = ["contracts/python/tests", "tests"]

[tool.mypy]
files = ["services", "scripts", "contracts/python", "tests/fixtures/tools"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
