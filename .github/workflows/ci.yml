name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.18"
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - run: make check
