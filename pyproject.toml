[project]
name = "disco-workspace"
version = "0.1.0"
description = "Disco development workspace"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy==1.16.1",
  "ruff==0.12.0",
]

[tool.uv.workspace]
members = ["services/*"]

[tool.mypy]
files = ["services", "scripts"]
python_version = "3.13"
strict = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
